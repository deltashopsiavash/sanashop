<!doctype html><html lang="fa" dir="rtl"><body style="margin:0;background:#f5f5f7;font-family:Tahoma,Arial,sans-serif;color:#202124"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f7;padding:28px 12px"><tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #ececf0;border-radius:22px;overflow:hidden"><tr><td style="padding:32px 28px;text-align:center">{% if logo_url %}<img src="{{ logo_url }}" width="82" height="82" alt="لوگوی {{ store.site_name }}" style="display:block;width:82px;height:82px;object-fit:cover;border-radius:50%;margin:0 auto 12px;border:1px solid #ececf0">{% else %}<div style="width:78px;height:78px;border-radius:50%;margin:0 auto 12px;background:{{ store.primary_color|default:'#7b243f' }};color:#fff;font-size:30px;font-weight:900;line-height:78px;text-align:center">{{ store.site_name|slice:':1' }}</div>{% endif %}<div style="font-size:14px;font-weight:800;color:#4a4f58;margin-bottom:10px">{{ store.site_name }}</div><h1 style="margin:0 0 12px;font-size:24px;color:#202124">تأیید ایمیل</h1><p style="margin:0 0 24px;font-size:14px;line-height:2;color:#666b75">برای تکمیل ساخت حساب، کد زیر را در سایت وارد کنید.</p><div style="direction:ltr;display:inline-block;min-width:230px;padding:18px 22px;border-radius:16px;background:#faf1f4;color:{{ store.primary_color|default:'#7b243f' }};font-size:36px;line-height:1;font-weight:900;letter-spacing:10px">{{ code }}</div><p style="margin:24px 0 0;font-size:13px;line-height:1.9;color:#8a8f98">این کد فقط ۱۰ دقیقه معتبر است.<br>اگر شما درخواست ثبت‌نام نداده‌اید، این پیام را نادیده بگیرید.</p></td></tr></table></td></tr></table></body></html>
