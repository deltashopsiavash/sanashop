<!doctype html><html lang="fa" dir="rtl"><body style="margin:0;background:#f5f5f7;font-family:Tahoma,Arial,sans-serif;color:#202124"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f7;padding:28px 12px"><tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #ececf0;border-radius:22px;overflow:hidden"><tr><td style="padding:32px 30px">{% if logo_url %}<img src="{{ logo_url }}" width="82" height="82" alt="لوگوی {{ store.site_name }}" style="display:block;width:82px;height:82px;object-fit:cover;border-radius:50%;margin:0 auto 12px;border:1px solid #ececf0">{% else %}<div style="width:78px;height:78px;border-radius:50%;margin:0 auto 12px;background:{{ store.primary_color|default:'#7b243f' }};color:#fff;font-size:30px;font-weight:900;line-height:78px;text-align:center">{{ store.site_name|slice:':1' }}</div>{% endif %}<div style="text-align:center;font-size:18px;font-weight:900;color:{{ store.primary_color|default:'#7b243f' }};margin-bottom:24px">{{ store.site_name }}</div><div style="font-size:14px;line-height:2.15;color:#383c44">{{ body_html|safe }}</div><div style="margin-top:28px;padding-top:18px;border-top:1px solid #efeff2;text-align:center;color:#9498a1;font-size:12px">این پیام از طرف {{ store.site_name }} ارسال شده است.</div></td></tr></table></td></tr></table></body></html>
