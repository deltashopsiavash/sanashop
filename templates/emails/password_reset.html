<!doctype html><html lang="fa" dir="rtl"><body style="margin:0;background:#f5f5f7;font-family:Tahoma,Arial,sans-serif;color:#202124"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f7;padding:28px 12px"><tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #ececf0;border-radius:22px;overflow:hidden"><tr><td style="padding:32px 28px;text-align:center">{% if logo_url %}<img src="{{ logo_url }}" width="82" height="82" alt="لوگوی {{ store.site_name|default:site_name }}" style="display:block;width:82px;height:82px;object-fit:cover;border-radius:50%;margin:0 auto 12px;border:1px solid #ececf0">{% else %}<div style="width:78px;height:78px;border-radius:50%;margin:0 auto 12px;background:{{ store.primary_color|default:'#7b243f' }};color:#fff;font-size:30px;font-weight:900;line-height:78px;text-align:center">{{ store.site_name|default:site_name|slice:':1' }}</div>{% endif %}<div style="font-size:14px;font-weight:800;color:#4a4f58;margin-bottom:10px">{{ store.site_name|default:site_name }}</div><h1 style="margin:0 0 12px;font-size:24px;color:#202124">بازیابی رمز عبور</h1><p style="margin:0 0 26px;font-size:14px;line-height:2;color:#666b75">برای انتخاب رمز عبور جدید روی دکمه زیر بزنید.</p><a href="{% if reset_url %}{{ reset_url }}{% else %}{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}{% endif %}" style="display:inline-block;padding:14px 28px;border-radius:14px;background:{{ store.primary_color|default:'#7b243f' }};color:#ffffff;text-decoration:none;font-size:15px;font-weight:800">تغییر رمز عبور</a><p style="margin:26px 0 0;font-size:13px;line-height:1.9;color:#8a8f98">اگر شما درخواست بازیابی رمز نداده‌اید، نیازی به انجام کاری نیست.</p></td></tr></table></td></tr></table></body></html>
