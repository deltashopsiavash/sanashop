{% extends 'shop/base.html' %}{% block content %}<main class="section"><div class="container auth-shell"><section class="auth-card"><h1>رمز عبور جدید</h1>{% if validlink %}<form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</div>{% endfor %}<button class="btn btn-primary btn-block">ذخیره رمز جدید</button></form>{% else %}<p>این لینک نامعتبر یا منقضی شده است.</p><a href="{% url 'password_reset' %}">درخواست لینک جدید</a>{% endif %}</section></div></main>{% endblock %}
