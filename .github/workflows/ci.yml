name: CI
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile external_bot.py external_bot_plus.py external_bot_v5.py external_bot_v6.py external_bot_v7.py external_bot_v8.py external_bot_v9.py external_bot_v10.py external_bot_v11.py external_bot_v12.py external_bot_v13.py external_bot_v14.py external_bot_v15.py external_bot_v16.py bot_resilience.py bot_single_instance.py shop/site_api_v10.py shop/checkout_views_v16.py shop/checkout_views_v17.py shop/order_creation_v17.py shop/media_hygiene.py
      - run: bash -n install-site.sh update-site.sh install-bot.sh update-bot.sh
      - run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "1"
          DOMAIN: example.com
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "1"
      - name: Create CI env file
        run: |
          cp .env.example .env
          sed -i "s#shop.example.com#example.com#g; s#owner@example.com#owner@example.com#g; s#change-me#test#g" .env
      - run: docker compose config --quiet
